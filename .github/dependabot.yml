version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      development-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint pins typescript to <6.1.0; a TypeScript major bump
      # makes `npm ci` fail with ERESOLVE. Re-enable once typescript-eslint
      # publishes support for the next TypeScript major.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run lint && npm test && npm run build

      - name: Package static site
        run: tar -czf "repo-vitals-${GITHUB_REF_NAME}.tar.gz" -C dist .

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "repo-vitals-${GITHUB_REF_NAME}.tar.gz" --verify-tag --generate-notes --title "RepoVitals $GITHUB_REF_NAME"
